name: Validate toolkit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check toolkit and installed scaffold
        run: python3 tools/workflow_toolkit.py check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render minimal Quarto example
        run: quarto render examples/minimal_quarto
